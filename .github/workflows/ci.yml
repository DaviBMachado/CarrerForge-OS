name: CI Pipeline

# Branch Promotion Strategy:
# - Feature branches (`feat/*`) merge into `dev` via Pull Request.
# - Integration branch (`dev`) merges into production (`main`) via Pull Request.
# - Direct commits to `main` are restricted; code promotion follows: feat/* -> dev -> main.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            pyproject.toml

      - name: Run Python Checks (Ruff & Pytest)
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          ruff check .
          ruff format --check .
          if [ -d "tests" ] || [ -d "backend/tests" ]; then
            pytest
          else
            echo "No test directory found yet. Skipping pytest."
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Run Frontend Checks (Lint & Build)
        run: |
          TARGET_DIR="."
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            TARGET_DIR="frontend"
          fi

          if [ -f "$TARGET_DIR/package.json" ]; then
            cd "$TARGET_DIR"
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            if npm run | grep -q "lint"; then
              npm run lint
            fi
            npm run build
          else
            echo "No frontend package.json found yet. Skipping frontend build check."
          fi
