name: CI Pipeline

# Branch Promotion Strategy:
# - Feature branches (`feat/*`) merge into `dev` via Pull Request.
# - Integration branch (`dev`) merges into production (`main`) via Pull Request.
# - Direct commits to `main` are restricted; code promotion follows: feat/* -> dev -> main.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate-branch-pipeline:
    name: Validate Branch Promotion Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Branch Promotion Rules
        run: |
          EVENT="${{ github.event_name }}"
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          REF="${{ github.ref }}"

          echo "Event: $EVENT | Base: $BASE | Head: $HEAD | Ref: $REF"

          if [ "$EVENT" = "pull_request" ]; then
            # Rule 1: Pull requests into 'main' must originate strictly from 'dev'
            if [ "$BASE" = "main" ]; then
              if [ "$HEAD" != "dev" ]; then
                echo "::error::❌ Invalid PR source! PRs targeting 'main' must originate from 'dev'. Received: '$HEAD'."
                echo "Enforced Pipeline: (feat|fix|refactor|...) -> dev -> main"
                exit 1
              fi
              echo "✅ PR validation passed: 'dev' -> 'main'"
            fi

            # Rule 2: Pull requests into 'dev' must use valid prefix
            if [ "$BASE" = "dev" ]; then
              if ! echo "$HEAD" | grep -Eq '^(feat|fix|refactor|chore|test|docs|perf|ci)/'; then
                echo "::error::❌ Invalid branch prefix for PR targeting 'dev'! Received: '$HEAD'."
                echo "Allowed branch prefixes: feat/*, fix/*, refactor/*, chore/*, test/*, docs/*, perf/*, ci/*"
                exit 1
              fi
              echo "✅ PR validation passed: '$HEAD' -> 'dev'"
            fi
          fi

          if [ "$EVENT" = "push" ]; then
            if [ "$REF" = "refs/heads/main" ]; then
              COMMIT_MSG="${{ github.event.head_commit.message }}"
              echo "Push to main detected. Head commit: $COMMIT_MSG"
              if ! echo "$COMMIT_MSG" | grep -Eqi '(merge pull request|merge branch .dev.|into main|\(#\d+\))'; then
                echo "::warning::⚠️ Direct push to 'main' detected! All changes should follow: (feat|fix|refactor|...) -> dev -> main."
              fi
            fi
          fi

  ci:
    name: Lint & Build Validation
    needs: [validate-branch-pipeline]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            pyproject.toml

      - name: Run Python Checks (Ruff & Pytest)
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          ruff check .
          ruff format --check .
          if [ -d "tests" ] || [ -d "backend/tests" ]; then
            pytest
          else
            echo "No test directory found yet. Skipping pytest."
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Run Frontend Checks (Lint & Build)
        run: |
          TARGET_DIR="."
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            TARGET_DIR="frontend"
          fi

          if [ -f "$TARGET_DIR/package.json" ]; then
            cd "$TARGET_DIR"
            if [ -f "package-lock.json" ]; then
              npm ci
            else
              npm install
            fi
            if npm run | grep -q "lint"; then
              npm run lint
            fi
            npm run build
          else
            echo "No frontend package.json found yet. Skipping frontend build check."
          fi
