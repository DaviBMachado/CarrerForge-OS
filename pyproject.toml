[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careerforge-os"
version = "0.1.0"
description = "CareerForge OS - AI-Powered Career Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "playwright>=1.40.0",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pyright>=1.1.414"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = [
    "assets*",
    "frontend*",
    "companies*",
    "general-resumes*",
    "_tools*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "frontend",
    "_tools",
    "companies",
    "general-resumes",
    ".backlogmd",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = [".git", ".venv", "frontend", "_tools", "companies", "general-resumes", ".backlogmd"]
addopts = "-ra -q"

[tool.pyright]
include = ["backend"]
exclude = [
    "backend/alembic",
    ".venv",
]
pythonVersion = "3.11"
reportMissingTypeStubs = false
