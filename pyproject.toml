[project]
name = "careerforge-os"
version = "0.1.0"
description = "CareerForge OS - AI-Powered Career Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "frontend",
    "_tools",
    "companies",
    "general-resumes",
    ".backlogmd",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = [".git", ".venv", "frontend", "_tools", "companies", "general-resumes", ".backlogmd"]
addopts = "-ra -q"
